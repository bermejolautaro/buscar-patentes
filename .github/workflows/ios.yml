# Compila el iPhone en la nube, sin firmar (contrato C1 de la 006).
#
# Sin secretos: el .ipa sale sin firma, y Sideloadly lo firma en la PC con el Apple ID del
# jugador (FR-003). Se lanza a mano con `gh workflow run ios.yml`, y con cada push a main.
name: iOS

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Linkear el framework de Kotlin/Native con Compose y el mapa no entra en 2 GB. Las
      # propiedades del usuario pisan las del proyecto, así la PC sigue con las suyas.
      - name: Memoria para Kotlin/Native
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx5g -XX:+UseParallelGC -Dfile.encoding=UTF-8" >> ~/.gradle/gradle.properties

      - name: Pruebas comunes en el motor del iPhone (D17)
        run: ./gradlew :shared:iosSimulatorArm64Test --console=plain

      - name: Framework de Kotlin para el iPhone
        run: ./gradlew :shared:linkReleaseFrameworkIosArm64 --console=plain

      - name: Proyecto de Xcode
        run: |
          brew install xcodegen
          cd iosApp && xcodegen

      - name: Compilar sin firmar
        run: |
          xcodebuild \
            -project iosApp/BuscarPatentes.xcodeproj \
            -scheme BuscarPatentes \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/xcode \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Empaquetar el .ipa
        run: |
          mkdir -p Payload
          cp -R build/xcode/Build/Products/Release-iphoneos/BuscarPatentes.app Payload/
          zip -qry buscar-patentes.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: buscar-patentes-ipa
          path: buscar-patentes.ipa
          retention-days: 14
